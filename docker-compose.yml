services:
  # Daily automated streak runner background service
  streak-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-badge-streak-agent
    shm_size: 2gb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9091:9091"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
      - ./dist:/app/dist:ro
    environment:
      - NODE_ENV=production
    command: ["scheduler:start"]

  # Prometheus metrics collector & time-series database
  prometheus:
    image: prom/prometheus:latest
    container_name: aws-streak-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=90d"
    depends_on:
      - streak-agent

  # One-time interactive browser authentication service (with Web UI on port 6080)
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-streak-auth
    shm_size: 2gb
    env_file:
      - .env
    ports:
      - "6080:6080"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
      - ./dist:/app/dist:ro
    environment:
      - NODE_ENV=development
      - TAILSCALE_IP=${TAILSCALE_IP:-}
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
    command: ["auth:login"]

  # Live visual execution service (watch the agent visit, like, and comment live on port 6080)
  streak-watch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-streak-watch
    shm_size: 2gb
    env_file:
      - .env
    ports:
      - "6080:6080"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
      - ./dist:/app/dist:ro
    environment:
      - NODE_ENV=development
      - TAILSCALE_IP=${TAILSCALE_IP:-}
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
    command: ["streak:watch", "--force", "--verbose"]
