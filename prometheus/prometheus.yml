global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aws-streak-agent"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["streak-agent:9091"]
        labels:
          app: "aws-builder-streak"
          environment: "homelab"
